<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    @media (max-width: 600px) {
      table, tr, td { display: block; width: 100% !important; height: auto !important; }
      img { max-width: 100%; height: auto; }
      td { text-align: center !important; }
    }
  </style>
</head>
<body bgcolor="#FFFFFF">
  <table width="100%" border="0">
    <tr align="center">
      <td valign="top">
        <p>&nbsp;</p>
        <p align="center">
          <img src="{{ '/images/band_name_bw.png' | relative_url }}" width="169"><br>
          <img src="{{ '/images/header_image.png' | relative_url }}" width="169">
        </p>
        {{ content }}
      </td>
    </tr>
  </table>
</body>
</html>
